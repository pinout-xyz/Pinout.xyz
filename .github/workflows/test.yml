name: Pages

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    name: Test Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: 3.11

      - name: Install Dependencies
        run: |
          make deps

      - name: Build Packages
        run: |
          make site
          make -C api
